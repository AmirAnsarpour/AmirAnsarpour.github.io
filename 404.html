<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found | Amir Ansarpour</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="img/fire.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css" />
    <script>
      tailwind.config = { theme: { extend: { colors: { iosBg: "#050505" } } } };
    </script>
  </head>
  <body class="bg-iosBg text-white min-h-screen flex items-center justify-center px-6">
    <div class="glass-card p-10 md:p-16 text-center max-w-md">
      <p class="text-sm font-bold uppercase tracking-[0.3em] text-blue-400 mb-4">

      </p>
      <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight mb-4">

      </h1>
      <p class="text-gray-400 mb-8">

      </p>
      <a
        href="/"
        class="glass-dropdown-btn px-6 py-3 text-sm inline-flex items-center"
